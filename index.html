<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سوق الهواتف المستعملة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #090d16;
            --bg-header: #111827;
            --border-color: #1f2937;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --card-bg: #111827;
            --card-border: #1f2937;
            --price-color: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #38bdf8, #6366f1);
            --input-bg: #030712;
            --footer-bg: #030712;
            --footer-text: #9ca3af;
            --modal-bg: #111827;
        }

        [data-theme="light"] {
            --bg-body: #f8fafc;
            --bg-header: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --price-color: #0284c7;
            --accent-gradient: linear-gradient(135deg, #0284c7, #4f46e5);
            --input-bg: #f1f5f9;
            --footer-bg: #1e293b;
            --footer-text: #f8fafc;
            --modal-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            background: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            width: 100%;
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-brand {
            display: flex;
            flex-direction: column;
        }

        h1 {
            font-size: 1.7rem;
            font-weight: 900;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .settings-container {
            position: relative;
        }

        .gear-btn {
            background: var(--border-color);
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: transform 0.3s ease;
        }

        .gear-btn:hover {
            transform: rotate(45deg);
        }

        .settings-dropdown {
            display: none;
            position: absolute;
            left: 0;
            top: 50px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 170px;
            padding: 8px;
            z-index: 101;
        }

        .settings-dropdown.active {
            display: block;
        }

        .theme-toggle-option {
            background: none;
            border: none;
            width: 100%;
            padding: 10px;
            text-align: right;
            color: var(--text-main);
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }

        .theme-toggle-option:hover {
            background: var(--border-color);
        }

        .main-content {
            width: 100%;
            max-width: 1200px;
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
        }

        .filter-wrapper {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 15px 20px;
            border-radius: 14px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }

        .filter-wrapper label {
            font-weight: 700;
            color: var(--text-main);
            font-size: 1rem;
        }

        .filter-wrapper input {
            padding: 10px 15px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 0.95rem;
            flex: 1;
            max-width: 300px;
            outline: none;
        }

        .filter-wrapper input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
        }

        .product-img-container {
            width: 100%;
            height: 210px;
            background: var(--input-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .img-thumbnails {
            display: flex;
            gap: 6px;
            padding: 10px 12px 0 12px;
        }

        .thumb-btn {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            cursor: pointer;
            background: none;
            padding: 0;
            opacity: 0.7;
            transition: opacity 0.2s, border-color 0.2s;
        }

        .thumb-btn.active, .thumb-btn:hover {
            border-color: #38bdf8;
            opacity: 1;
        }

        .thumb-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-content {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .product-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .product-desc {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .product-location {
            font-size: 0.82rem;
            color: #38bdf8;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .product-footer {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 8px;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
        }

        .product-info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price {
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--price-color);
        }

        .qty-container {
            display: flex;
            align-items: center;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        .qty-btn {
            background: var(--border-color);
            color: var(--text-main);
            border: none;
            width: 30px;
            height: 30px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
        }

        .qty-value {
            padding: 0 10px;
            font-size: 0.95rem;
            font-weight: 700;
        }

        .actions-row {
            display: flex;
            gap: 8px;
        }

        .buy-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 9px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            text-decoration: none;
            font-size: 0.9rem;
            flex: 1;
            text-align: center;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2);
        }

        .cart-btn {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.2);
        }

        .cart-float-container {
            margin: 40px 0 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            width: 100%;
            max-width: 420px;
        }

        .cart-action-btn {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            border: none;
            padding: 13px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            width: 100%;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.25);
        }

        .send-cart-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            border: none;
            padding: 13px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.25);
            width: 100%;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: var(--modal-bg);
            border: 1px solid var(--border-color);
            padding: 22px;
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            color: var(--text-main);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        .modal-header {
            font-size: 1.25rem;
            font-weight: 800;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-modal {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.6rem;
            cursor: pointer;
        }

        .modal-body {
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
            gap: 10px;
            font-size: 0.92rem;
        }

        .remove-item-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .modal-footer {
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
            display: flex;
            justify-content: space-between;
            font-weight: 800;
            font-size: 1.1rem;
            color: var(--price-color);
        }

        footer {
            background-color: var(--footer-bg);
            color: var(--footer-text);
            width: 100%;
            padding: 30px 20px 15px;
            margin-top: 50px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .footer-content {
            max-width: 700px;
            margin-bottom: 15px;
        }

        .footer-title {
            font-size: 1.4rem;
            font-weight: 900;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .footer-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .footer-bottom {
            border-top: 1px solid var(--border-color);
            width: 100%;
            padding-top: 12px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-muted);
            font-size: 1.05rem;
            padding: 40px;
        }
    </style>
</head>

            settingsDropdown.classList.remove("active");

    <script>

        function switchTheme() {
            const currentTheme = htmlElement.getAttribute("data-theme");
            if (currentTheme === "dark") {
                htmlElement.setAttribute("data-theme", "light");

                themeText.innerText = "الوضع الليلي";
                localStorage.setItem("theme", "light");
            } else {
                htmlElement.setAttribute("data-theme", "dark");

                localStorage.setItem("theme", "dark");

        // استرجاع الثيم المحفوظ مسبقاً
        const savedTheme = localStorage.getItem("theme");
        if (savedTheme) {
            htmlElement.setAttribute("data-theme", savedTheme);
            if (savedTheme === "light") {
                themeIcon.innerText = "🌙";
                themeText.innerText = "الوضع الليلي";

            background: linear-gradient(to right, #38bdf8, #818cf8);

        }

        .modal {

<body>

    <header>
        <h1>متجري الإلكتروني</h1>
        <p class="subtitle">أحدث المنتجات المتوفرة حالياً بكل تميز وجودة</p>
    </header>

    <div class="main-content">
        <div class="grid-container" id="products-container"></div>

        <div class="cart-float-container" id="cart-section" style="display: none;">
            <button onclick="showCartModal()" class="cart-action-btn">
                🛍️ عرض محتويات السلة وحساب المجموع
            </button>
            <button onclick="sendCart()" class="send-cart-btn">
                🛒 إرسال السلة الكاملة عبر واتساب
            </button>
        </div>
    </div>

    <div class="modal" id="cartModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>محتويات السلة</span>
                <button class="close-modal" onclick="closeCartModal()">&times;</button>
            </div>
            <div class="modal-body" id="modal-cart-items"></div>
            <div class="modal-footer">
                <span>المجموع الكلي:</span>
                <span id="modal-total-price">0</span>
            </div>
        </div>
    </div>
    <footer>
        <div class="footer-content">
            <div class="footer-title">متجري الإلكتروني</div>
            <div class="footer-desc">نعمل على تقديم أفضل المنتجات والخدمات المتميزة لضمان رضاكم، مع الالتزام بمعايير الجودة والسرعة في تلبية الطلبات عبر واتساب.</div>
        </div>
        <div class="footer-bottom">
            جميع الحقوق محفوظة © 2026
        </div>
    </footer>

    <script src="products.js"></script>

    <script>
        const container = document.getElementById("products-container");
        const cartSection = document.getElementById("cart-section");
        const cartModal = document.getElementById("cartModal");
        const modalCartItems = document.getElementById("modal-cart-items");
        const modalTotalPrice = document.getElementById("modal-total-price");
        const ownerPhone = "963946887715";
        let cart = [];

        function increaseQty(id) {
            let qtyEl = document.getElementById("qty-" + id);
            let current = parseInt(qtyEl.innerText);
            qtyEl.innerText = current + 1;
        }

        function decreaseQty(id) {
            let qtyEl = document.getElementById("qty-" + id);
            let current = parseInt(qtyEl.innerText);
            if (current > 1) {
                qtyEl.innerText = current - 1;
            }
        }

        function sendWhatsApp(name, price, id) {
            let qty = parseInt(document.getElementById("qty-" + id).innerText);
            let message = encodeURIComponent(`مرحباً، أريد شراء هذا المنتج:\nالاسم: ${name}\nالسعر: ${price}\nالكمية: ${qty}`);
            let whatsappUrl = `https://wa.me/${ownerPhone}?text=${message}`;
            window.open(whatsappUrl, '_blank');
        }

        function addToCart(name, price, id) {
            let qty = parseInt(document.getElementById("qty-" + id).innerText);
            let numericPrice = parseFloat(price.replace(/[^0-9.]/g, '')) || 0;

            let item = cart.find(x => x.name == name);

            if (item) {
                item.qty += qty;
            } else {
                cart.push({
                    name: name,
                    priceStr: price,
                    priceNum: numericPrice,
                    qty: qty
                });
            }

            updateCartUI();
            alert("تمت إضافة المنتج إلى السلة بنجاح! 🛒");
        }

        function updateCartUI() {
            if (cart.length > 0) {
                cartSection.style.display = "flex";
            } else {
                cartSection.style.display = "none";
                closeCartModal();
            }
        }

        // دالة حذف منتج من السلة وتحديث النافذة والمجموع فورا
        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
            if (cart.length > 0) {
                showCartModal(); // إعادة تحديث محتوى النافذة والمجموع
            }
        }

        function showCartModal() {
            if (cart.length == 0) {
                alert("السلة فارغة!");
                closeCartModal();
                return;
            }

            modalCartItems.innerHTML = "";
            let total = 0;

            cart.forEach((p, index) => {
                let itemTotal = p.priceNum * p.qty;
                total += itemTotal;

                modalCartItems.innerHTML += `
                    <div class="cart-item-row">
                        <div>
                            <strong>${p.name}</strong><br>
                            <span style="color: #94a3b8; font-size: 0.85rem;">الكمية: ${p.qty} | السعر: ${itemTotal}</span>
                        </div>
                        <button class="remove-item-btn" onclick="removeFromCart(${index})">حذف</button>
                    </div>
                `;
            });

            modalTotalPrice.innerText = total;
            cartModal.style.display = "flex";
        }

        function closeCartModal() {
            cartModal.style.display = "none";
        }

        function sendCart() {
            if (cart.length == 0) {
                alert("السلة فارغة!");
                return;
            }

            let text = "مرحباً، أريد طلب المنتجات التالية:\n\n";
            let total = 0;

            cart.forEach((p, i) => {
                let itemTotal = p.priceNum * p.qty;
                total += itemTotal;
                text += `${i + 1}- ${p.name}\nالكمية: ${p.qty}\nالسعر: ${p.priceStr}\n------------------\n`;
            });

            text += `\nالمجموع الكلي: ${total}`;

            let whatsappUrl = `https://wa.me/${ownerPhone}?text=` + encodeURIComponent(text);
            window.open(whatsappUrl, '_blank');
        }

        if (typeof products !== "undefined" && products.length > 0) {
            container.innerHTML = "";
            products.forEach((p, index) => {
                let imagePath = p.image && p.image.trim() !== "" ? p.image : "https://via.placeholder.com/300x180?text=No+Image";
                let productId = index;

                container.innerHTML += `
                    <div class="product-card">
                        <div class="product-img-container">
                            <img src="${imagePath}" alt="${p.name}" class="product-img" onerror="this.src='https://via.placeholder.com/300x180?text=No+Image'">
                        </div>
                        <div class="product-content">
                            <div class="product-title">${p.name}</div>
                            <div class="product-footer">
                                <div class="product-info-row">
                                    <span class="price">${p.price}</span>
                                    <div class="qty-container">
                                        <button class="qty-btn" onclick="decreaseQty(${productId})">-</button>
                                        <span class="qty-value" id="qty-${productId}">1</span>
                                        <button class="qty-btn" onclick="increaseQty(${productId})">+</button>
                                    </div>
                                </div>
                                <div class="actions-row">
                                    <button onclick="addToCart('${p.name}', '${p.price}', ${productId})" class="buy-btn cart-btn">
                                        أضف للسلة
                                    </button>
                                    <button onclick="sendWhatsApp('${p.name}', '${p.price}', ${productId})" class="buy-btn">
                                        شراء مباشر
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        } else {
            container.innerHTML = `<div class="empty-state">لا توجد منتجات مطروحة حالياً. اضغط حفظ من برنامج الـ C# لتظهر المنتجات هنا.</div>`;
        }
    </script>
