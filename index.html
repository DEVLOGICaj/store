<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>متجري الإلكتروني</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
        }

        h1 {
            font-size: 2rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 1rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 1100px;
        }

        .product-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .product-img-container {
            width: 100%;
            height: 170px;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .product-title {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: #f1f5f9;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            border-top: 1px solid #334155;
            padding-top: 12px;
        }

        .price {
            font-size: 1.1rem;
            font-weight: bold;
            color: #38bdf8;
        }

        .buy-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            font-size: 0.95rem;
            display: inline-block;
            text-align: center;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            color: #94a3b8;
            font-size: 1.1rem;
            padding: 40px;
        }

        /* تحسينات إضافية خاصة بالشاشات الصغيرة جداً */
        @media (max-width: 480px) {
            body {
                padding: 15px 10px;
            }
            h1 {
                font-size: 1.75rem;
            }
            .grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>متجري الإلكتروني</h1>
        <p class="subtitle">أحدث المنتجات المتوفرة حالياً</p>
    </header>

    <div class="grid-container" id="products-container"></div>

    <script src="products.js?V=2"></script>

    <script>
        const container = document.getElementById("products-container");
        const ownerPhone = "963946887715";

        if (typeof products !== "undefined" && products.length > 0) {
            container.innerHTML = "";
            products.forEach(p => {
                let imagePath = p.image && p.image.trim() !== "" ? p.image : "https://via.placeholder.com/300x180?text=No+Image";

                let message = encodeURIComponent(`مرحباً، أريد شراء هذا المنتج:\nالاسم: ${p.name}\nالسعر: ${p.price}`);
                let whatsappUrl = `https://wa.me/${ownerPhone}?text=${message}`;

                container.innerHTML += `
                    <div class="product-card">
                        <div class="product-img-container">
                            <img src="${imagePath}" alt="${p.name}" class="product-img" onerror="this.src='https://via.placeholder.com/300x180?text=No+Image'">
                        </div>
                        <div class="product-content">
                            <div class="product-title">${p.name}</div>
                            <div class="product-footer">
                                <span class="price">${p.price}</span>
                                <a href="${whatsappUrl}" target="_blank" class="buy-btn">شراء عبر الواتس</a>
                            </div>
                        </div>
                    </div>
                `;
            });
        } else {
            container.innerHTML = `<div class="empty-state">لا توجد منتجات مطروحة حالياً. اضغط حفظ من برنامج الـ C# لتظهر المنتجات هنا.</div>`;
        }
    </script>

</body>
</html>
